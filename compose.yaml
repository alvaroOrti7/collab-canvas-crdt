name: collab-canvas

x-app: &app
  build:
    context: .
    dockerfile: .devcontainer/Dockerfile
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment:
    DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas
      POSTGRES_DB: canvas
    volumes:
      # Postgres 18 movió PGDATA a /var/lib/postgresql/18/docker. Montar el volumen en la
      # ruta heredada /var/lib/postgresql/data hace que la imagen aborte con exit 1;
      # montar el directorio padre deja que Postgres use su layout versionado dentro del
      # volumen y mantiene viable un futuro `pg_upgrade --link`.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canvas -d canvas']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8.8.1-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *app
    command: pnpm --filter api dev
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:3001/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  sync:
    <<: *app
    command: pnpm --filter sync dev
    ports:
      - '1234:1234'

  web:
    <<: *app
    command: pnpm --filter web dev
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
      REDIS_URL: redis://redis:6379
      VITE_API_URL: http://localhost:3001

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles: ['test']
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      E2E_BASE_URL: http://web:5173
      SYNC_URL: ws://sync:1234
      API_URL: http://api:3001
      DATABASE_URL: postgres://canvas:canvas@postgres:5432/canvas
    depends_on:
      - web
      - sync
      - api
    # La imagen oficial de Playwright trae Node y corepack, pero no un binario `pnpm`
    # en el PATH: verificado empíricamente, `pnpm exec ...` a secas falla con
    # "executable file not found in $PATH". `corepack pnpm` sí funciona y respeta la
    # versión fijada en el `packageManager` del repo.
    command: corepack pnpm exec playwright test

volumes:
  pgdata:
